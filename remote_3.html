<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0907">
<title>PASSING TRAIN — 탑승하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0907;--ink:#f3e6cf;--dim:rgba(243,230,207,.55);--line:rgba(255,236,205,.28);--glow:rgba(255,228,185,.55)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overscroll-behavior:none}
  body{background:radial-gradient(120% 60% at 50% 0%,#241c15 0%,var(--bg) 60%)}
  #app{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
       min-height:100vh;display:flex;flex-direction:column;gap:18px}
  header{text-align:center}
  .title{font-family:"Noto Serif KR",serif;font-weight:700;letter-spacing:.32em;font-size:22px;text-shadow:0 0 18px var(--glow)}
  .sub{color:var(--dim);font-size:13px;margin-top:6px}
  .pill{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:var(--dim);
        border:1px solid var(--line);border-radius:99px;padding:4px 10px}
  .pill i{width:7px;height:7px;border-radius:50%;background:#8a4b44}
  .pill.on i{background:#f1dcb0;box-shadow:0 0 8px #ffe6b5}
  section{display:flex;flex-direction:column;gap:14px}
  [hidden]{display:none!important}
  .frame{position:relative;width:100%;aspect-ratio:1.34;border-radius:18px;overflow:hidden;background:#1a1510;
         box-shadow:0 0 0 2px rgba(255,246,230,.85),0 0 28px 6px var(--glow),0 0 90px 10px rgba(255,220,170,.18);touch-action:none}
  .frame::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:18px;
         background:radial-gradient(ellipse 75% 75% at 50% 50%,transparent 55%,rgba(255,244,226,.35) 100%)}
  #photo{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;user-select:none;pointer-events:none}
  .fx #photo{filter:grayscale(1) sepia(.55) contrast(1.12) brightness(1.18)}
  .guide{position:absolute;left:50%;top:47%;width:44%;height:80%;transform:translate(-50%,-50%);
         border:2px dashed rgba(255,246,230,.7);border-radius:50%;pointer-events:none;z-index:2;transition:opacity .3s}
  .frame.moving .guide{opacity:.35}
  .placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
         color:var(--dim);font-size:13px;text-align:center;
         background:radial-gradient(ellipse at center,#5c5043 0%,#2a221b 70%)}
  .placeholder svg{opacity:.55}
  .hint{text-align:center;color:var(--dim);font-size:13px;margin:0}
  .btns{display:flex;gap:10px}
  button,.btn{flex:1;appearance:none;border:1px solid var(--line);background:rgba(255,240,215,.06);color:var(--ink);
         font:inherit;font-size:16px;font-weight:600;padding:16px 12px;border-radius:14px;min-height:56px;cursor:pointer;
         display:flex;align-items:center;justify-content:center;gap:8px}
  button:active{transform:scale(.98)}
  .primary{background:linear-gradient(180deg,#fff4df,#e9d2a8);color:#1a130c;border-color:transparent;box-shadow:0 0 22px rgba(255,226,180,.35)}
  button:disabled{opacity:.45}
  .row{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:13px}
  input[type=range]{flex:1;accent-color:#e9d2a8;height:28px}
  label.chk{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px;justify-content:center}
  label.chk input{width:18px;height:18px;accent-color:#e9d2a8}
  .done{text-align:center;padding:10px 0}
  .done h2{font-family:"Noto Serif KR",serif;font-size:24px;margin:10px 0 6px;letter-spacing:.08em;text-shadow:0 0 16px var(--glow)}
  .done p{color:var(--dim);margin:0;font-size:14px;line-height:1.6}
  .thumb{width:62%;margin:6px auto 0;aspect-ratio:1.34;border-radius:14px;overflow:hidden;
         box-shadow:0 0 0 2px rgba(255,246,230,.85),0 0 24px 4px var(--glow)}
  .thumb img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) sepia(.55) contrast(1.12) brightness(1.18);display:block}
  #toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
         background:rgba(20,15,11,.95);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;
         opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
  #toast.show{opacity:1}
  input[type=file]{display:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">PASSING TRAIN</div>
    <div class="sub">지나가는 기차 창문에 당신의 얼굴을 태워 보세요</div>
    <div id="conn" class="pill"><i></i><span>화면과 연결 중…</span></div>
  </header>

  <!-- 1. 사진 고르기 -->
  <section id="s-pick">
    <div class="frame">
      <div class="placeholder">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#f3e6cf" stroke-width="1.3"><circle cx="12" cy="9" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        얼굴이 창문 가운데 오도록 찍어 주세요
      </div>
    </div>
    <div class="btns">
      <label class="btn primary" for="cam">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>셀카 찍기</label>
      <label class="btn" for="gal">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>앨범에서</label>
    </div>
    <input id="cam" type="file" accept="image/*" capture="user">
    <input id="gal" type="file" accept="image/*">
  </section>

  <!-- 2. 창문에 맞추기 -->
  <section id="s-crop" hidden>
    <div id="frame" class="frame fx">
      <canvas id="photo"></canvas>
      <div class="guide"></div>
    </div>
    <p class="hint">드래그로 위치 · 두 손가락으로 크기 조절<br>얼굴을 점선 안에 맞춰 주세요</p>
    <div class="row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-4-4"/></svg>
      <input id="zoom" type="range" min="1" max="4" step="0.01" value="1">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M20 20l-4-4"/></svg>
    </div>
    <label class="chk"><input id="fx" type="checkbox" checked> 기차 필터 미리보기</label>
    <div class="btns">
      <button id="back">다시 선택</button>
      <button id="send" class="primary">탑승하기</button>
    </div>
  </section>

  <!-- 3. 탑승 완료 -->
  <section id="s-done" hidden>
    <div class="done">
      <div class="thumb"><img id="sentImg" alt=""></div>
      <h2 id="doneTitle">탑승 완료</h2>
      <p id="doneMsg">큰 화면을 봐 주세요.<br>오른쪽에서 당신의 창문이 들어옵니다.</p>
    </div>
    <button id="again">한 번 더 탑승하기</button>
  </section>
</div>
<div id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const P = new URLSearchParams(location.search);
const ROOM = (P.get('room') || 'TRAIN').toUpperCase().replace(/[^A-Z0-9]/g,'');
const HOST_ID = 'aplan-passingtrain-' + ROOM.toLowerCase();
let ASPECT = 1.34;
const OUT_W = 720;

const $ = id => document.getElementById(id);
const show = id => { for (const s of ['s-pick','s-crop','s-done']) $(s).hidden = s !== id; };
function toast(msg, ms=2600){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),ms); }

/* ---------- 연결 ---------- */
let peer = null, conn = null, ready = false, pending = null;
function setConn(on, txt){ $('conn').classList.toggle('on', on); $('conn').querySelector('span').textContent = txt; }
function connect(){
  if (typeof Peer === 'undefined'){ setConn(false,'연결 모듈 로드 실패'); return; }
  if (!peer || peer.destroyed){
    peer = new Peer();
    peer.on('open', ()=>openConn());
    peer.on('error', e=>{
      ready = false;
      setConn(false, e.type==='peer-unavailable' ? '화면이 아직 켜지지 않았어요 · 재시도 중' : '연결 재시도 중…');
      setTimeout(retry, 3000);
    });
    peer.on('disconnected', ()=>{ ready=false; setConn(false,'연결 재시도 중…'); setTimeout(()=>{ try{peer.reconnect();}catch(e){} }, 1500); });
  } else openConn();
}
function retry(){ if (ready) return; if (peer && peer.open) openConn(); else { try{peer && peer.destroy();}catch(e){} peer=null; connect(); } }
function openConn(){
  try{ conn && conn.close(); }catch(e){}
  conn = peer.connect(HOST_ID, {reliable:true});
  conn.on('open', ()=>{ ready = true; setConn(true, `연결됨 · ${ROOM}`); });
  conn.on('data', onData);
  conn.on('close', ()=>{ ready=false; setConn(false,'연결이 끊겼어요 · 재시도 중'); setTimeout(retry, 2000); });
  conn.on('error', ()=>{ ready=false; setTimeout(retry, 2000); });
}
function onData(d){
  if (!d) return;
  if (d.type === 'config' && d.aspect){ ASPECT = d.aspect; document.querySelectorAll('.frame').forEach(f=>f.style.aspectRatio = ASPECT); if (img) layout(true); }
  else if (d.type === 'queued'){ $('doneTitle').textContent = '탑승 대기 중'; $('doneMsg').innerHTML = '빈 창문을 찾고 있어요.<br>잠시만 기다려 주세요.'; }
  else if (d.type === 'ok'){
    clearTimeout(pending); pending = null;
    $('doneTitle').textContent = '탑승 완료';
    $('doneMsg').innerHTML = d.eta > 2
      ? `약 <b>${d.eta}초</b> 뒤, 오른쪽에서<br>당신의 창문이 들어옵니다.`
      : '지금 큰 화면을 봐 주세요!<br>당신의 얼굴이 떠오르고 있어요.';
    if (navigator.vibrate) navigator.vibrate(60);
  }
  else if (d.type === 'err'){ clearTimeout(pending); toast(d.msg || '전송에 실패했어요'); show('s-crop'); $('send').disabled=false; }
}
connect();

/* ---------- 사진 불러오기 ---------- */
let img = null, iw = 0, ih = 0, fw = 0, fh = 0, base = 1, zoom = 1, tx = 0, ty = 0;
const photo = $('photo'), frame = $('frame');
function onFile(e){
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  const url = URL.createObjectURL(f), im = new Image();
  im.onload = ()=>{
    const MAX = 1600, s = Math.min(1, MAX / Math.max(im.naturalWidth, im.naturalHeight));
    iw = Math.round(im.naturalWidth*s); ih = Math.round(im.naturalHeight*s);
    photo.width = iw; photo.height = ih;
    photo.getContext('2d').drawImage(im, 0, 0, iw, ih);
    photo.style.width = iw+'px'; photo.style.height = ih+'px';
    URL.revokeObjectURL(url);
    img = photo; zoom = 1; $('zoom').value = 1;
    show('s-crop'); requestAnimationFrame(()=>layout(true));
  };
  im.onerror = ()=>toast('사진을 열 수 없어요. 다른 사진을 골라 주세요.');
  im.src = url;
}
$('cam').addEventListener('change', onFile);
$('gal').addEventListener('change', onFile);

function layout(recenter){
  const r = frame.getBoundingClientRect();
  const cx = fw ? (fw/2 - tx)/(base*zoom) : 0, cy = fh ? (fh/2 - ty)/(base*zoom) : 0;
  fw = r.width; fh = r.height;
  base = Math.max(fw/iw, fh/ih);
  const s = base*zoom;
  if (recenter){ tx = (fw - iw*s)/2; ty = (fh - ih*s)/2 - (ih*s - fh)*0.1; }
  else { tx = fw/2 - cx*s; ty = fh/2 - cy*s; }
  apply();
}
function clampPos(){
  const s = base*zoom;
  tx = Math.min(0, Math.max(fw - iw*s, tx));
  ty = Math.min(0, Math.max(fh - ih*s, ty));
}
function apply(){ clampPos(); photo.style.transform = `translate(${tx}px,${ty}px) scale(${base*zoom})`; }
function zoomAt(nz, px, py){
  nz = Math.min(4, Math.max(1, nz));
  const s0 = base*zoom, s1 = base*nz;
  tx = px - (px - tx)*(s1/s0); ty = py - (py - ty)*(s1/s0);
  zoom = nz; $('zoom').value = nz; apply();
}
addEventListener('resize', ()=>{ if (!$('s-crop').hidden) layout(false); });
$('zoom').addEventListener('input', e=>zoomAt(+e.target.value, fw/2, fh/2));
$('fx').addEventListener('change', e=>frame.classList.toggle('fx', e.target.checked));

/* 드래그 · 핀치 */
const pts = new Map(); let lastMid = null, lastDist = 0;
function mid(){ const a=[...pts.values()]; return {x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2}; }
function dist(){ const a=[...pts.values()]; return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y); }
function local(e){ const r = frame.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
frame.addEventListener('pointerdown', e=>{
  frame.setPointerCapture(e.pointerId); pts.set(e.pointerId, local(e)); frame.classList.add('moving');
  if (pts.size === 2){ lastMid = mid(); lastDist = dist(); }
});
frame.addEventListener('pointermove', e=>{
  if (!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId), cur = local(e);
  if (pts.size === 1){ tx += cur.x - prev.x; ty += cur.y - prev.y; pts.set(e.pointerId, cur); apply(); }
  else if (pts.size === 2){
    pts.set(e.pointerId, cur);
    const m = mid(), d = dist();
    tx += m.x - lastMid.x; ty += m.y - lastMid.y;
    zoomAt(zoom * (d / (lastDist||d)), m.x, m.y);
    lastMid = m; lastDist = d;
  }
});
function up(e){ pts.delete(e.pointerId); if (pts.size < 2) lastMid = null; if (!pts.size) frame.classList.remove('moving'); }
frame.addEventListener('pointerup', up); frame.addEventListener('pointercancel', up);
frame.addEventListener('wheel', e=>{ e.preventDefault(); const p = local(e); zoomAt(zoom * (e.deltaY<0?1.08:1/1.08), p.x, p.y); }, {passive:false});

/* ---------- 전송 ---------- */
$('back').onclick = ()=>show('s-pick');
$('again').onclick = ()=>show('s-pick');
$('send').onclick = ()=>{
  if (!ready || !conn || !conn.open){ toast('큰 화면과 아직 연결되지 않았어요. 잠시 후 다시 눌러 주세요.'); retry(); return; }
  const s = base*zoom;
  const out = document.createElement('canvas');
  out.width = OUT_W; out.height = Math.round(OUT_W / ASPECT);
  out.getContext('2d').drawImage(photo, -tx/s, -ty/s, fw/s, fh/s, 0, 0, out.width, out.height);
  const data = out.toDataURL('image/jpeg', 0.86);
  $('send').disabled = true;
  try { conn.send({type:'face', img: data}); }
  catch(e){ $('send').disabled = false; toast('전송에 실패했어요. 다시 시도해 주세요.'); return; }
  $('sentImg').src = data;
  $('doneTitle').textContent = '탑승 중…';
  $('doneMsg').innerHTML = '기차로 얼굴을 보내고 있어요.';
  show('s-done'); $('send').disabled = false;
  pending = setTimeout(()=>{ $('doneTitle').textContent='전송 확인 중'; $('doneMsg').innerHTML='응답이 늦어지고 있어요.<br>큰 화면을 확인해 주세요.'; }, 9000);
};
</script>
</body>
</html>
